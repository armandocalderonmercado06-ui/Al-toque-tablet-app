<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParyKub</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#041a3a;overflow:hidden}
  body{display:grid;place-items:center}

  /* El escenario ocupa toda la pantalla, incluso fuera de 16:9 */
  .stage{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    height:100dvh;
    container-type:inline-size;
    overflow:hidden;
    background:#0b3d7a;
    -webkit-user-select:none;user-select:none;
  }
  .plate{position:absolute;inset:0;width:100%;height:100%;display:block}

  /* Todas las capas salen de tu imagen original, sin redibujar nada */
  .L{position:absolute;display:block;height:auto;opacity:0;will-change:transform;pointer-events:none;
     --enter:enter .85s cubic-bezier(.34,1.56,.64,1) var(--d) both}
  #txt{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
  .stage:not(.run) .L{animation:none!important;opacity:0}

  @keyframes enter{
    from{opacity:0;transform:translate(var(--fx,0),var(--fy,0)) rotate(var(--fr,0deg)) scale(var(--fs,.25))}
    to{opacity:1;transform:none}
  }

  /* Pulsos e idles */
  @keyframes pulse   {0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
  @keyframes tilePulse{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.09) rotate(var(--tr,4deg))}}
  @keyframes sway    {0%,100%{transform:rotate(-4.5deg) scale(1)}50%{transform:rotate(5deg) scale(1.05)}}
  @keyframes bob     {0%,100%{transform:translateY(0) rotate(-6deg) scale(1)}50%{transform:translateY(-1.5cqw) rotate(7deg) scale(1.09)}}
  @keyframes twinkle {0%,100%{transform:scale(1) rotate(0);filter:brightness(1)}50%{transform:scale(1.24) rotate(11deg);filter:brightness(1.28)}}
  @keyframes balloonSway{0%,100%{transform:rotate(-3.5deg) translateY(0)}50%{transform:rotate(4deg) translateY(-1cqw)}}
  @keyframes floaty  {0%,100%{transform:translate(0,0) rotate(0) scale(1);filter:brightness(1)}50%{transform:translate(var(--dx),var(--dy)) rotate(var(--rr)) scale(1.18);filter:brightness(1.25)}}
  @keyframes reveal  {from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  @keyframes rbWave  {0%,100%{transform:scaleY(1) skewX(0)}50%{transform:scaleY(1.1) skewX(-1.4deg)}}

  .hat    {animation:var(--enter), sway 1.5s ease-in-out calc(var(--d) + .85s) infinite;
           --fy:-34cqw;--fr:-70deg;--fs:.4}
  .tile   {animation:var(--enter), tilePulse var(--p) ease-in-out calc(var(--d) + .85s) infinite}
  .note   {animation:var(--enter), bob 1.6s ease-in-out calc(var(--d) + .85s) infinite;
           --fy:6cqw;--fr:-45deg;--fs:0}
  .star   {animation:var(--enter), twinkle var(--p) ease-in-out calc(var(--d) + .85s) infinite;
           --fr:-220deg;--fs:0}
  .balloon{animation:enter 1.5s cubic-bezier(.22,.9,.3,1.12) var(--d) both,
                     balloonSway 2.1s ease-in-out calc(var(--d) + 1.5s) infinite;
           --fy:60cqw;--fs:.55}
  .conf   {animation:var(--enter), floaty var(--p) ease-in-out calc(var(--d) + .85s) infinite;
           --fr:-180deg;--fs:0}
  .rainbow{opacity:1;
           animation:reveal 1s cubic-bezier(.4,.1,.3,1) var(--d) both,
                     rbWave 1.5s ease-in-out calc(var(--d) + 1s) infinite}

  /* Barra de 5 s + botón */
  .bar{position:absolute;left:0;bottom:0;height:.7cqw;width:100%;background:rgba(255,255,255,.12)}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffc21a,#ff8a1f,#ff4d6d,#2aa8f2);animation:bar 5s linear forwards}
  .stage:not(.run) .bar i{animation:none}
  @keyframes bar{to{width:100%}}
  .cta{
    position:absolute;left:55.5%;bottom:3.2%;transform:translateX(-50%) scale(.4);opacity:0;
    padding:.7cqw 3.6cqw;border:0;border-radius:99cqw;cursor:pointer;
    font:800 2.3cqw/1.2 "Baloo 2","Arial Rounded MT Bold",Arial,sans-serif;color:#0d2f7a;
    background:linear-gradient(180deg,#ffe066,#ffab1a);
    box-shadow:0 .5cqw 0 #c77700,0 1cqw 2cqw rgba(0,0,0,.35);
    pointer-events:none;cursor:default;
    animation:ctaIn .6s cubic-bezier(.34,1.7,.64,1) 4s forwards, ctaPulse 1s ease-in-out 4.6s infinite;
  }
  .stage:not(.run) .cta{animation:none}
  @keyframes ctaIn{to{opacity:1;transform:translateX(-50%) scale(1)}}
  @keyframes ctaPulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
  .replay{
    display:none;
    position:absolute;right:1.6cqw;top:1.6cqw;z-index:5;border:0;border-radius:99cqw;cursor:pointer;
    background:rgba(255,255,255,.16);color:#fff;padding:.45cqw 1.4cqw;font:700 1.4cqw Arial,sans-serif;
  }
  .replay:hover{background:rgba(255,255,255,.3)}
</style>
</head>

<script>
(() => {
  const stage = document.getElementById('stage');
  const cvs   = document.getElementById('txt');
  const ctx   = cvs.getContext('2d');
  const src   = document.getElementById('txtSrc');
  const TX = 386, TY = 289, TW = 828, TH = 301, SW = 3;

  function resizeCanvas(){
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
    const { width, height } = stage.getBoundingClientRect();
    cvs.width = Math.round(width * pixelRatio);
    cvs.height = Math.round(height * pixelRatio);
    ctx.setTransform(cvs.width / 1452, 0, 0, cvs.height / 817, 0, 0);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
  }

  const clamp = (v,a=0,b=1) => Math.min(b, Math.max(a, v));
  const smooth = u => { u = clamp(u); return u*u*(3-2*u); };
  const easeOutBack = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(u-1,3) + c1*Math.pow(u-1,2); };

  let t0 = 0, raf = 0;

  function draw(t){
    ctx.clearRect(0, 0, 1452, 817);
    ctx.imageSmoothingQuality = 'high';
    const env = smooth((t - 1.8) / 0.6);              // la ola entra suave tras la caída

    for (let sx = 0; sx < TW; sx += SW){
      const w  = Math.min(SW, TW - sx);
      const xn = (sx + w/2) / TW;                      // 0 = P, 1 = b
      const u  = clamp((t - (0.55 + xn*0.8)) / 0.8);   // entrada escalonada de la P a la b
      if (u <= 0) continue;
      const dyIn = (1 - easeOutBack(u)) * -360;        // cae con rebote
      const ph   = (t - 1.8) * Math.PI*2*0.75 - xn * Math.PI*2*1.1;
      const dyW  = -env * 9 * Math.sin(ph);            // curva/ola que viaja de la P a la b
      const sc   = 1 + env * 0.045 * Math.sin(ph + 0.9); // pulso
      const h    = TH * sc;
      ctx.globalAlpha = Math.min(1, u * 3);
      ctx.drawImage(src, sx, 0, w, TH, TX + sx, TY + dyIn + dyW - (h - TH)*0.55, w, h);
    }
    ctx.globalAlpha = 1;

    // destello de luz que cruza el texto de la P a la b
    if (t > 2.2){
      const s = ((t - 2.2) % 2.8) / 0.9;
      if (s >= 0 && s <= 1){
        const cx = TX - 140 + s * (TW + 280);
        ctx.save();
        ctx.globalCompositeOperation = 'source-atop';
        ctx.translate(cx, TY + TH/2); ctx.rotate(-0.35);
        const g = ctx.createLinearGradient(-60, 0, 60, 0);
        g.addColorStop(0, 'rgba(255,255,255,0)');
        g.addColorStop(.5, 'rgba(255,255,255,.55)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.fillRect(-60, -420, 120, 840);
        ctx.restore();
      }
    }
  }

  function loop(now){
    draw((now - t0) / 1000);
    raf = requestAnimationFrame(loop);
  }

  function play(){
    cancelAnimationFrame(raf);
    stage.classList.remove('run');
    void stage.offsetWidth;
    stage.classList.add('run');
    t0 = performance.now();
    raf = requestAnimationFrame(loop);
  }

  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Espera a que carguen las imágenes (máx. 1 s) y arranca la intro
  const ready = Promise.all([...document.images].map(i => i.decode ? i.decode().catch(()=>{}) : 0));
  Promise.race([ready, new Promise(r => setTimeout(r, 1000))]).then(() => {
    play();
    window.parent.postMessage({ type: 'partykub-solo-intro-started' }, window.location.origin);
  });
})();
</script>
</body>
